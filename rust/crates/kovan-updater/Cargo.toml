[package]
name = "kovan-updater"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "Kovan guncelleyicisi: GitHub Releases + Ed25519 imza + SHA-256 dogrulama. Hicbir dosyayi calistirmaz."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
url = "2"

[features]
default = ["http"]
http = ["dep:ureq"]

[dependencies.ureq]
version = "2"
optional = true
