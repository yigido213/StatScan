[package]
name = "statscan-core"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "StatScan statik tarama motoru (Rust). Dosyayi calistirmaz, ag kullanmaz."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
url = "2"
fancy-regex = "0.20.1"
flate2 = "1.1.11"
memchr = "2"
