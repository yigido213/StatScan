[package]
name = "kovan-tauri"
version = "0.1.0"
edition = "2024"
publish = false

# Keep the experimental shell's desktop dependencies out of the core/CLI workspace.
[workspace]
resolver = "3"

[build-dependencies]
tauri-build = "2"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
statscan-core = { path = "../crates/statscan-core" }
tauri = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
