name: Verify Kovan Tauri on Windows
on:
  push:
    branches: [codex-tauri-windows-check]
permissions:
  contents: read

jobs:
  tauri:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: rustup default stable
      - run: cargo build --manifest-path rust/kovan-tauri/Cargo.toml --features custom-protocol
      - name: Verify actual WebView2 and Rust IPC
        run: |
          $exe = Join-Path (Get-Location) 'rust/kovan-tauri/target/debug/kovan-tauri.exe'
          $failedModes = @()
          foreach ($mode in @('regular', 'transparent')) {
            $argsForTest = @('--verify-webview2')
            if ($mode -eq 'transparent') { $argsForTest += '--transparent' }
            $out = Join-Path $env:RUNNER_TEMP "kovan-$mode.out"
            $err = Join-Path $env:RUNNER_TEMP "kovan-$mode.err"
            Write-Output "Checking $mode window"
            $p = Start-Process -FilePath $exe -ArgumentList $argsForTest -WindowStyle Hidden -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            if (-not $p.WaitForExit(30000)) {
              $p.Kill()
              $p.WaitForExit()
              Get-Content $out, $err
              Write-Output "$mode window did not report a WebView2 result"
              $failedModes += $mode
              continue
            }
            Get-Content $out, $err
            if ($p.ExitCode -ne 0) { $failedModes += $mode }
          }
          if ($failedModes.Count) { throw ('Window checks failed: ' + ($failedModes -join ', ')) }
